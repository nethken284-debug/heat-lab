<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heat Lab 熱學實驗室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Section 1 Heat 互動溫習：溫度與溫度計、熱與熱容量、比熱容、能量守恆、溫度–時間圖，連考試。">
<meta name="theme-color" content="#120d26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Chiron+GoRound+TC:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a dark "thermal camera" lab. One content column (≤1040px); every station is an instrument panel.
   Colour is physics: cold→hot runs blue→red, and each quantity (E, m, c, C, ΔT, P, t) owns one hue everywhere. */
:root {
  --bg: #120d26;
  --bg-deep: #0b0819;
  --hud-bg: rgba(18, 13, 38, 0.88);
  --panel: #1b1538;
  --panel-2: #241c4a;
  --panel-3: #2e2560;
  --inset: #0e0a20;
  --line: #352b66;
  --line-2: #4c4088;
  --text: #f5f1ff;
  --muted: #bcb2e0;
  --dim: #8a80b8;
  --cold: #4f8cff;
  --cool: #38d1ff;
  --warm: #ffb02e;
  --hot: #ff5363;
  --white-hot: #fff2bf;
  --on-warm: #241000;
  --on-cold: #001830;
  --qE: #ffd23f;
  --qm: #52e3a0;
  --qc: #b892ff;
  --qC: #ff7cc8;
  --qT: #ff9b42;
  --qP: #62d5ff;
  --qt: #d3d9ff;
  --good: #52e3a0;
  --bad: #ff5d76;
  --ironbow: linear-gradient(90deg, #2a1260 0%, #5b1a8f 20%, #b5197a 40%, #f0473a 60%, #ff9d1f 80%, #fff2a8 100%);
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
  --font-zh: "Chiron GoRound TC", "PingFang TC", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Baloo 2", "Chiron GoRound TC", "PingFang TC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-math: "Times New Roman", Times, "STIX Two Text", Georgia, serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: radial-gradient(900px 520px at 85% -8%, #2b1757 0%, transparent 62%),
              radial-gradient(700px 420px at -10% 30%, #10224d 0%, transparent 60%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-zh);
  font-size: 16px;
  line-height: 1.7;
  min-height: 100%;
}
h1, h2, h3, h4 { line-height: 1.25; text-wrap: balance; margin: 0; }
p { margin: 0; }
b, strong { font-weight: 700; }
a { color: var(--cool); }
button { font: inherit; color: inherit; }
svg text { font-family: var(--font-zh); }
::selection { background: var(--hot); color: var(--white-hot); }

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.main { padding-block: 22px 96px; }

/* ---------- HUD ---------- */
.hud {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--hud-bg);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.hud-inner { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.logo {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; padding: 6px 4px; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: .04em;
  color: var(--text);
}
.logo:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; border-radius: 10px; }
.brain { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 300px; margin-left: auto; }
.brain-bar { position: relative; flex: 1; height: 10px; border-radius: 99px; background: var(--ironbow); border: 1px solid var(--line-2); overflow: hidden; min-width: 50px; }
.brain-cover { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; background: var(--inset); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.brain-label { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.joules { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: .82rem; color: var(--qE); white-space: nowrap; font-variant-numeric: tabular-nums; }
.joules.bump { animation: bump .5s; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }
@media (max-width: 560px) {
  .brain-label { display: none; }
  .logo span { display: none; }
  .hud-inner { gap: 10px; }
}

/* ---------- generic ---------- */
.stack { display: flex; flex-direction: column; gap: 22px; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.two > * { min-width: 0; }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: .88rem; }
.tiny { font-size: .78rem; }
.center { text-align: center; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.hl-hot { color: var(--hot); font-weight: 700; }
.hl-cold { color: var(--cool); font-weight: 700; }
.hl-warm { color: var(--warm); font-weight: 700; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.svg-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.svg-fit { width: 100%; height: auto; display: block; }
kbd { font-family: var(--font-mono); font-size: .85em; padding: 1px 6px; border-radius: 6px; background: var(--inset); border: 1px solid var(--line-2); }

/* ---------- buttons, chips, controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 9px 18px;
  border-radius: 999px; border: 1px solid var(--line-2);
  background: var(--panel-2); color: var(--text);
  font-weight: 700; font-size: .97rem; line-height: 1.2; cursor: pointer;
  transition: transform .12s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:hover { background: var(--panel-3); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn:focus-visible, .chip:focus-visible, .opt:focus-visible, .seg button:focus-visible, .card-link:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }
.btn[disabled] { opacity: .42; cursor: not-allowed; transform: none; }
.btn.hot { background: linear-gradient(135deg, var(--hot), var(--warm)); color: var(--on-warm); border-color: transparent; }
.btn.hot:hover { box-shadow: 0 0 0 4px rgba(255, 120, 60, .25); }
.btn.cold { background: linear-gradient(135deg, var(--cold), var(--cool)); color: var(--on-cold); border-color: transparent; }
.btn.cold:hover { box-shadow: 0 0 0 4px rgba(60, 170, 255, .25); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: .88rem; }
.btn.lg { min-height: 54px; padding: 12px 26px; font-size: 1.08rem; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text);
  font-weight: 700; font-size: .95rem; cursor: pointer;
  transition: transform .12s, background-color .2s, border-color .2s, opacity .2s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.chip:hover { background: var(--panel-3); }
.chip:active { transform: scale(.96); }
.chip.used { opacity: .35; }
.chip.sel { border-color: var(--warm); background: rgba(255, 176, 46, .16); }
.chip.ok { border-color: var(--good); background: rgba(82, 227, 160, .16); }
.chip.no { border-color: var(--bad); background: rgba(255, 93, 118, .16); }

.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--inset); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: .9rem;
  min-height: 36px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }

.stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--inset); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--panel-2); color: var(--text); font-size: 1.2rem; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.stepper button:hover { background: var(--panel-3); }
.stepper button:focus-visible { outline: 3px solid var(--cool); outline-offset: 1px; }
.stepper output { min-width: 74px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: .85rem; color: var(--muted); font-weight: 700; }
input[type="range"] { width: 100%; accent-color: var(--warm); height: 30px; margin: 0; cursor: pointer; }
input[type="range"].cold { accent-color: var(--cool); }
select, .num {
  font: inherit; color: var(--text); background: var(--inset);
  border: 1px solid var(--line-2); border-radius: 12px; min-height: 44px; padding: 8px 12px;
}
select:focus-visible, .num:focus-visible { outline: 3px solid var(--cool); outline-offset: 1px; }
.num { width: 9.5em; max-width: 100%; font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.num.sm { width: 6.2em; }
.num.ok { border-color: var(--good); box-shadow: 0 0 0 3px rgba(82, 227, 160, .18); }
.num.no { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(255, 93, 118, .18); }
.input-unit { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.input-unit .u { color: var(--muted); font-weight: 700; }

/* ---------- formulae ---------- */
.fx { font-family: var(--font-math); font-size: 1.32em; display: inline-flex; align-items: center; flex-wrap: wrap; gap: .22em; line-height: 1.3; }
.fx.big { font-size: clamp(1.6rem, 4.5vw, 2.3rem); }
.v { font-family: var(--font-math); font-style: italic; font-weight: 700; }
.vE { color: var(--qE); } .vm { color: var(--qm); } .vc { color: var(--qc); } .vC { color: var(--qC); }
.vT { color: var(--qT); } .vP { color: var(--qP); } .vt { color: var(--qt); } .vl { color: var(--cool); }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; }
.frac > span { padding: 0 .18em; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding-bottom: .06em; }
.frac > span:last-child { padding-top: .06em; }
.u-inline { font-family: var(--font-zh); font-style: normal; font-size: .82em; color: var(--muted); font-weight: 700; }
.fx-line { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.work { font-family: var(--font-math); font-size: 1.12rem; line-height: 1.9; background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 16px; overflow-x: auto; }
.work .ln { white-space: nowrap; }
.work .note { font-family: var(--font-zh); font-size: .85rem; color: var(--muted); }

/* ---------- station ---------- */
.station {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: clamp(16px, 3vw, 28px);
  display: flex; flex-direction: column; gap: 16px;
  transition: border-color .4s;
  scroll-margin-top: 80px;
}
.station.is-done { border-color: rgba(82, 227, 160, .45); }
.st-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.st-tag { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; letter-spacing: .04em; white-space: nowrap; }
.st-head h2 { font-size: clamp(1.18rem, 2.6vw, 1.5rem); flex: 1 1 260px; }
.st-done { color: var(--good); font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 4px; }
.st-goal { font-size: .88rem; color: var(--warm); display: flex; gap: 8px; align-items: baseline; }
.st-goal::before { content: "任務"; font-family: var(--font-mono); font-size: .7rem; border: 1px solid var(--warm); border-radius: 6px; padding: 0 6px; flex: none; }
.station.is-done .st-goal { color: var(--good); }
.station.is-done .st-goal::before { content: "完成"; border-color: var(--good); }

.panel-inset { background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; }
.panel-soft { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px; }

/* English must-memorise box */
.en {
  position: relative; background: var(--inset); border: 1px dashed var(--line-2); border-radius: var(--r-md);
  padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px;
}
.en-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.en-label { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em; color: var(--warm); text-transform: uppercase; }
.en-text { font-size: 1.05rem; line-height: 1.75; }
.en-text + .en-text { border-top: 1px solid var(--line); padding-top: 8px; }
.en-zh { font-size: .9rem; color: var(--muted); }
.mask {
  border-radius: 6px; padding: 0 3px; cursor: pointer;
  color: var(--white-hot); background: rgba(255, 155, 66, .16); box-shadow: inset 0 -2px 0 rgba(255, 155, 66, .6);
  transition: color .2s, background-color .2s;
}
.mask.hid { color: transparent; background: var(--line-2); box-shadow: none; }
.mask.hid::selection { color: transparent; }
.en-tools .btn { min-height: 32px; padding: 4px 12px; font-size: .8rem; }

/* fill-in */
.fill-text { font-size: 1.05rem; line-height: 2.2; }
.blank {
  display: inline-flex; align-items: center; justify-content: center; min-width: 5.4em; min-height: 32px;
  padding: 0 10px; margin: 0 2px; border-radius: 10px; vertical-align: middle; line-height: 1.3;
  border: 2px dashed var(--line-2); background: var(--inset); color: var(--white-hot); font-weight: 700; cursor: pointer;
}
.blank.active { border-color: var(--warm); border-style: solid; box-shadow: 0 0 0 3px rgba(255, 176, 46, .2); }
.blank.ok { border-color: var(--good); border-style: solid; color: var(--good); }
.blank.no { border-color: var(--bad); border-style: solid; color: var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }

/* MCQ */
.q-text { font-size: 1.06rem; line-height: 1.7; }
.q-zh { font-size: .9rem; color: var(--muted); }
.opts { display: grid; gap: 10px; }
.opts.cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 520px) { .opts.cols2 { grid-template-columns: minmax(0, 1fr); } }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  padding: 11px 14px; border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--panel-2);
  color: var(--text); cursor: pointer; font-size: 1rem; line-height: 1.5;
  transition: background-color .2s, border-color .2s, transform .1s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.opt:hover { background: var(--panel-3); }
.opt:active { transform: scale(.99); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--inset); font-family: var(--font-display); font-weight: 800; font-size: .95rem; }
.opt .t { min-width: 0; padding-top: 1px; }
.opt.pick { border-color: var(--warm); background: rgba(255, 176, 46, .12); }
.opt.ok { border-color: var(--good); background: rgba(82, 227, 160, .14); }
.opt.ok .k { background: var(--good); color: var(--inset); }
.opt.no { border-color: var(--bad); background: rgba(255, 93, 118, .12); }
.opt.no .k { background: var(--bad); color: var(--inset); }
.opt[disabled] { cursor: default; }
.feedback { border-radius: var(--r-md); padding: 12px 14px; border: 1px solid var(--line-2); background: var(--panel-2); font-size: .95rem; }
.feedback.ok { border-color: rgba(82, 227, 160, .6); }
.feedback.no { border-color: rgba(255, 93, 118, .6); }
.feedback .fb-title { font-weight: 800; margin-bottom: 4px; }
.feedback.ok .fb-title { color: var(--good); }
.feedback.no .fb-title { color: var(--bad); }

/* mascot */
.sir { display: flex; gap: 10px; align-items: flex-end; }
.sir-fig { width: 52px; flex: none; }
.sir-fig svg { width: 100%; height: auto; display: block; }
.bubble {
  position: relative; background: var(--panel-2); border: 1px solid var(--line-2);
  border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: .97rem; line-height: 1.6; min-width: 0;
}
.bubble b { color: var(--warm); }

/* toast */
.toast-host { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 80; pointer-events: none; padding-inline: 16px; }
.toast {
  pointer-events: none; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text);
  border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: .95rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: toastIn .35s ease, toastOut .35s ease 2.1s forwards;
}
.toast.energy { color: var(--qE); }
.toast.good { color: var(--good); }
.toast.bad { color: var(--bad); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }

/* ---------- home ---------- */
.hero { position: relative; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-deep); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11, 8, 25, .88) 0%, rgba(11, 8, 25, .6) 42%, rgba(11, 8, 25, 0) 72%); pointer-events: none; }
@media (max-width: 640px) { .hero-shade { background: linear-gradient(180deg, rgba(11, 8, 25, .35) 0%, rgba(11, 8, 25, .78) 55%, rgba(11, 8, 25, .9) 100%); } }
.hero-inner { position: relative; padding: clamp(22px, 5vw, 48px); display: flex; flex-direction: column; gap: 14px; pointer-events: none; }
.hero-inner .btn, .hero-inner .sir { pointer-events: auto; }
.hero-kicker { font-family: var(--font-mono); font-size: .76rem; letter-spacing: .18em; color: var(--white-hot); text-transform: uppercase; opacity: .85; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 9vw, 5.2rem); line-height: .95; letter-spacing: .01em; color: var(--white-hot); text-shadow: 0 2px 30px rgba(255, 120, 40, .45); }
.hero h1 small { display: block; font-family: var(--font-zh); font-size: .5em; letter-spacing: .12em; margin-top: 10px; color: var(--text); text-shadow: none; }
.hero-hint { font-size: .85rem; color: var(--white-hot); opacity: .8; }
.hero .sir { max-width: 560px; }

.map { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 700px) { .map { grid-template-columns: minmax(0, 1fr); } }
.card-link {
  position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start;
  text-align: left; width: 100%; padding: 16px; border-radius: var(--r-lg);
  border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  transition: transform .18s, border-color .2s, background-color .2s;
}
.card-link:hover { transform: translateY(-2px); border-color: var(--line-2); background: var(--panel-2); }
.card-link .ico { width: 64px; height: 64px; border-radius: 16px; background: var(--inset); border: 1px solid var(--line); display: grid; place-items: center; }
.card-link .ico svg { width: 40px; height: 40px; }
.card-link .card-title { display: block; font-size: 1.12rem; font-weight: 700; line-height: 1.3; }
.card-link .en-sub { font-family: var(--font-display); font-weight: 600; font-size: .9rem; color: var(--muted); }
.card-link .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; color: var(--dim); margin-top: 4px; font-family: var(--font-mono); }
.card-link .heat { margin-top: 10px; height: 6px; border-radius: 99px; background: var(--ironbow); position: relative; overflow: hidden; }
.card-link .heat i { position: absolute; top: 0; right: 0; bottom: 0; background: var(--inset); }
.card-link.special { grid-column: 1 / -1; border-color: rgba(184, 146, 255, .55); background: linear-gradient(135deg, #2a1d5c 0%, #1b1538 60%); }
.card-link.special .tagline { font-size: .92rem; color: var(--muted); margin-top: 4px; }
.badge-new { display: inline-block; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; background: var(--qc); color: var(--inset); font-weight: 700; vertical-align: middle; margin-left: 6px; }
.stars { color: var(--warm); letter-spacing: 2px; font-size: .95rem; }
.stars .off { color: var(--line-2); }
.section-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-size: 1.3rem; }

/* world page */
.world-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 8px 0 4px; }
@media (max-width: 640px) { .world-hero { grid-template-columns: minmax(0, 1fr); } }
.world-hero .kicker { font-family: var(--font-mono); font-size: .76rem; letter-spacing: .12em; color: var(--muted); }
.world-hero h1 { font-size: clamp(1.8rem, 5.5vw, 2.7rem); font-weight: 800; }
.world-hero h1 .en-t { display: block; font-family: var(--font-display); font-weight: 600; font-size: .52em; color: var(--muted); letter-spacing: .02em; margin-top: 4px; }
.toc { display: flex; gap: 8px; flex-wrap: wrap; }
.toc button { font-size: .82rem; padding: 4px 12px; min-height: 32px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); color: var(--muted); cursor: pointer; }
.toc button.done { color: var(--good); border-color: rgba(82, 227, 160, .5); }
.world-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* readouts & meters */
.readout { font-family: var(--font-mono); background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 12px; font-variant-numeric: tabular-nums; }
.readout .big { font-size: 1.5rem; font-weight: 700; }
.lcd { font-family: var(--font-mono); font-weight: 700; color: #b9ffcf; background: #07130d; border: 1px solid #1f4d33; border-radius: 8px; padding: 6px 10px; letter-spacing: .06em; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(120, 255, 170, .45); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.kv dt { color: var(--muted); font-size: .88rem; }
.kv dd { margin: 0; font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: .95rem; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 8px 10px; text-align: center; }
.tbl th { background: var(--panel-2); color: var(--muted); font-weight: 700; }
.tbl td.num-cell { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tbl tr.hl td { background: rgba(255, 176, 46, .12); }

/* flip cards */
.flip-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .flip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.flip { perspective: 900px; cursor: pointer; border: 0; padding: 0; background: none; text-align: left; min-height: 210px; }
.flip-in { position: relative; width: 100%; height: 100%; min-height: 210px; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; border-radius: var(--r-lg); border: 1px solid var(--line-2); background: var(--panel-2); padding: 14px; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.flip-back { transform: rotateY(180deg); background: var(--inset); font-size: .88rem; line-height: 1.55; overflow-y: auto; }
.flip-sym { font-family: var(--font-math); font-style: italic; font-weight: 700; font-size: 4rem; line-height: 1; }
.flip-sym.up { font-style: normal; }
.flip-name { font-weight: 700; }
.flip-tap { margin-top: auto; font-size: .78rem; color: var(--dim); }

/* energy grid */
.eg-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: end; }
@media (max-width: 560px) { .eg-wrap { grid-template-columns: minmax(0, 1fr); } .eg-thermo { display: none; } }
.eg-grid { display: grid; gap: 5px; width: 100%; max-width: 460px; }
.eg-cell {
  aspect-ratio: 1.25; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: clamp(.58rem, 1.9vw, .78rem); font-weight: 700; color: var(--dim);
  transition: background-color .25s, border-color .25s, color .25s, transform .25s, box-shadow .25s, opacity .25s;
  min-width: 0; overflow: hidden;
}
.eg-cell.lit { background: rgba(255, 210, 63, .2); border-color: var(--qE); color: var(--qE); box-shadow: 0 0 14px rgba(255, 210, 63, .35); }
.eg-cell.focus-c { background: rgba(184, 146, 255, .28); border-color: var(--qc); color: var(--text); transform: scale(1.06); box-shadow: 0 0 16px rgba(184, 146, 255, .5); }
.eg-cell.focus-C { background: rgba(255, 124, 200, .22); border-color: var(--qC); color: var(--text); box-shadow: 0 0 14px rgba(255, 124, 200, .4); }
.eg-cell.focus-E { background: rgba(255, 210, 63, .2); border-color: var(--qE); color: var(--text); }
.eg-cell.faded { opacity: .35; }
.eg-rowlab { font-family: var(--font-mono); font-size: .72rem; color: var(--qT); display: grid; place-items: center end; padding-right: 4px; white-space: nowrap; }
.eg-collab { font-family: var(--font-mono); font-size: .72rem; color: var(--qm); text-align: center; }
.eg-explain { min-height: 3.4em; }

/* game bits */
.score-pill { font-family: var(--font-mono); font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--inset); border: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.timer-bar { height: 8px; border-radius: 99px; background: var(--inset); overflow: hidden; border: 1px solid var(--line); }
.timer-bar i { display: block; height: 100%; background: var(--ironbow); transition: width .25s linear; }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px;
  border-radius: var(--r-md); border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; color: var(--text);
  font-weight: 700; font-size: .9rem; text-align: center; transition: transform .12s, border-color .2s, background-color .2s;
  touch-action: manipulation;
}
.tile:hover { background: var(--panel-3); }
.tile svg { width: 44px; height: 44px; }
.tile .order { position: absolute; top: 6px; left: 8px; font-family: var(--font-display); font-weight: 800; color: var(--warm); }
.tile.picked { border-color: var(--warm); }
.tile.ok { border-color: var(--good); }
.tile.no { border-color: var(--bad); }
.tile .tval { font-family: var(--font-mono); font-size: .8rem; color: var(--qT); }

/* boss */
.boss-arena { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 640px) { .boss-arena { grid-template-columns: minmax(0, 1fr); } }
.hp { height: 14px; border-radius: 99px; background: var(--inset); border: 1px solid var(--line-2); overflow: hidden; }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--cool), var(--cold)); transition: width .5s; }
.hearts { font-size: 1.3rem; color: var(--hot); letter-spacing: 4px; }
.hearts .off { color: var(--line-2); }

/* exam */
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.palette button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); font-family: var(--font-mono); font-weight: 700; cursor: pointer; }
.palette button.ans { background: var(--panel-3); color: var(--text); }
.palette button.cur { border-color: var(--warm); color: var(--warm); }
.palette button.ok { border-color: var(--good); color: var(--good); }
.palette button.no { border-color: var(--bad); color: var(--bad); }
.result-big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 9vw, 4.2rem); line-height: 1; }
.bar-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.2em; gap: 10px; align-items: center; font-size: .88rem; }
.bar-row .track { height: 10px; border-radius: 99px; background: var(--inset); overflow: hidden; border: 1px solid var(--line); }
.bar-row .track i { display: block; height: 100%; background: var(--ironbow); }
.review-item { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.graph-q { max-width: 420px; }

/* animations */
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
@keyframes toastIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(8px); opacity: 0; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes steam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: .8; } 100% { transform: translateY(-18px); opacity: 0; } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.shake { animation: shake .45s; }
.pop { animation: pop .4s ease both; }
.floaty { animation: floaty 3s ease-in-out infinite; }
.steam path, .steam-anim { animation: steam 2.2s ease-in infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- base resets for the standalone build ---------- */
[hidden] { display: none !important; }
img { max-width: 100%; }

/* ---------- world 1 ---------- */
.feel-row { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 6em; gap: 10px; align-items: center; }
.feel-bar { position: relative; height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--cold), #8fb6ff 45%, #ffc48a 55%, var(--hot)); }
.feel-bar i { position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--text); border: 3px solid var(--inset); transition: left .8s cubic-bezier(.3, .1, .2, 1); }
.feel-txt { font-size: .95rem; }
@media (max-width: 480px) { .feel-row { grid-template-columns: minmax(0, 1fr) 5.5em; } .feel-row .lbl { grid-column: 1 / -1; } }

/* ---------- world 2 ---------- */
.prop-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) { .prop-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .prop-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.prop { background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.prop .lbl { font-size: .8rem; }
.p-lc { transition: fill .3s; }
details > summary { cursor: pointer; list-style: revert; }
.q-hint summary { font-size: .85rem; color: var(--cool); font-weight: 700; }
.q-hint[open] summary { margin-bottom: 4px; }

/* ---------- world 3 ---------- */
.kwh-dials { display: inline-flex; gap: 3px; justify-content: center; align-items: flex-end; }
.kd { display: inline-grid; place-items: center; width: 1.55em; height: 2.1em; background: #0b0b14; color: #f4f4f4; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 1.15rem; box-shadow: inset 0 -6px 8px rgba(255, 255, 255, .06); }
.kd:last-child { background: #5a0d18; }
.kd-dot { font-family: var(--font-mono); font-weight: 700; padding-bottom: 2px; }

/* ---------- world 4 ---------- */
.eg-ctrl select { max-width: 100%; }
.eg-thermo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cancel { text-decoration: line-through; text-decoration-color: var(--hot); text-decoration-thickness: 2px; }
.unit-t { font-family: var(--font-math); font-weight: 700; font-size: 1.6rem; min-width: 64px; min-height: 52px; padding: 4px 14px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--panel-2); color: var(--text); cursor: pointer; }
.unit-t.on { background: var(--panel-3); box-shadow: 0 0 0 3px rgba(255, 255, 255, .08); }
.unit-t:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }
.ub-frac { display: inline-flex; flex-direction: column; align-items: center; align-self: center; min-width: 9em; font-family: var(--font-math); font-size: 1.4rem; font-weight: 700; }
.ub-frac .ub-bar { width: 100%; height: 2px; background: var(--text); margin: 4px 0; }
.ub-top, .ub-bot { min-height: 1.4em; }
.se-row { display: grid; grid-template-columns: 9.5em 3.4em minmax(0, 1fr) 6.4em; gap: 10px; align-items: center; font-size: .9rem; padding: 2px 6px; border-radius: 8px; }
.se-row.hl { background: rgba(56, 209, 255, .08); }
.se-track { height: 12px; border-radius: 99px; background: var(--inset); border: 1px solid var(--line); overflow: hidden; }
.se-track i { display: block; height: 100%; width: 0; transition: width .35s ease; }
.se-c { color: var(--qc); text-align: right; }
@media (max-width: 560px) { .se-row { grid-template-columns: 6.4em 3em minmax(0, 1fr) 5.6em; font-size: .8rem; gap: 6px; } .se-name .dim { display: none; } }
.sort-card { font-size: 1.15rem; font-weight: 700; text-align: center; padding: 22px 16px; border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line-2); }

/* ---------- world 6 & 7 ---------- */
.sankey { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; align-items: stretch; }
.sk-in { display: grid; place-items: center; border-radius: 10px; background: var(--qE); color: var(--on-warm); font-weight: 800; font-family: var(--font-mono); font-size: .9rem; min-height: 54px; }
.sk-out { display: flex; gap: 3px; min-height: 54px; border-radius: 10px; overflow: hidden; }
.sk-out i { display: block; min-width: 0; transition: flex-grow .3s ease; }
.sk-w { background: var(--cool); } .sk-c { background: var(--qc); } .sk-s { background: var(--warm); }
.race-lane { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--inset); }
.race-lane.pick { border-color: var(--warm); }
.race-lane .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.race-lane select { min-height: 38px; padding: 4px 10px; }

/* ---------- pocket calculator (every page) ---------- */
.calc-fab {
  position: fixed; z-index: 70;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 18px 0 14px; border-radius: 999px; cursor: pointer;
  background: linear-gradient(135deg, var(--cold), var(--cool)); color: var(--on-cold);
  border: 0; font-weight: 800; font-size: .95rem;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .12) inset;
  transition: transform .15s ease, box-shadow .15s ease;
}
.calc-fab svg { width: 24px; height: 24px; flex: none; }
.calc-fab:hover { box-shadow: 0 10px 28px rgba(0, 0, 0, .5), 0 0 0 5px rgba(60, 170, 255, .25); }
.calc-fab:active { transform: scale(.95); }
.calc-fab:focus-visible { outline: 3px solid var(--white-hot); outline-offset: 3px; }
.calc-fab.on { background: var(--panel-3); color: var(--text); box-shadow: 0 10px 28px rgba(0, 0, 0, .5), 0 0 0 1px var(--line-2) inset; }
@media (max-width: 560px) { .calc-fab { width: 52px; padding: 0; justify-content: center; } .calc-fab-lbl { display: none; } }

.calc {
  position: fixed; z-index: 70;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100vw - 32px));
  max-height: calc(100vh - 160px); overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px; border-radius: var(--r-lg);
  background: var(--panel); border: 1px solid var(--line-2);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
}
.calc.in { animation: calcIn .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes calcIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.calc-head { display: flex; align-items: center; justify-content: space-between; }
.calc-title { font-weight: 800; color: var(--muted); font-size: .9rem; letter-spacing: .06em; padding-left: 4px; }
.calc-x { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; }
.calc-x svg { width: 16px; height: 16px; }
.calc-x:focus-visible, .ck:focus-visible, .calc-chip:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }
.calc-screen { background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; text-align: right; min-width: 0; }
.calc-expr { min-height: 1.6em; font-size: 1rem; color: var(--muted); white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
.calc-expr::-webkit-scrollbar { display: none; }
.calc-res { min-height: 1.5em; font-size: 1.55rem; font-weight: 700; color: var(--qE); white-space: nowrap; overflow-x: auto; scrollbar-width: none; line-height: 1.3; }
.calc-res::-webkit-scrollbar { display: none; }
.calc-res .bad { font-size: .95rem; }
.calc-screen sup { font-size: .62em; }
.calc-hist { display: flex; flex-wrap: wrap; gap: 6px; }
.calc-hist:empty { display: none; }
.calc-chip { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; font-size: .78rem; color: var(--muted); cursor: pointer; }
.calc-chip:hover { color: var(--text); }
.calc-chip sup { font-size: .7em; }
.calc-keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.ck {
  min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
  font-family: var(--font-mono); font-size: 1rem; font-weight: 600; cursor: pointer; padding: 0;
  transition: background .12s ease, transform .08s ease;
}
.ck sup { font-size: .65em; }
.ck:hover { background: var(--panel-3); }
.ck:active { transform: scale(.94); }
.ck.n { background: var(--panel-3); font-size: 1.08rem; }
.ck.n:hover { background: var(--line-2); }
.ck.op { color: var(--cool); font-size: 1.2rem; }
.ck.fn { color: var(--hot); font-size: .85rem; }
.ck.eq { grid-column: span 2; background: linear-gradient(135deg, var(--hot), var(--warm)); color: var(--on-warm); border-color: transparent; font-size: 1.25rem; }
.calc-fill { width: 100%; }

</style>
</head>
<body>
<header class="hud" id="hud">
  <div class="wrap hud-inner">
    <button class="logo" id="hud-home" type="button" aria-label="返回地圖">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="2" width="6" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18" r="4" fill="var(--hot)"/><rect x="11" y="8" width="2" height="9" fill="var(--hot)"/></svg>
      <span>HEAT&nbsp;LAB</span>
    </button>
    <div class="brain" title="腦溫：完成越多，溫度越高">
      <div class="brain-bar"><div class="brain-cover" id="brain-cover"></div></div>
      <span class="brain-label" id="brain-label">腦溫 0 °C</span>
    </div>
    <div class="joules" id="hud-joules" title="答啱題、玩完實驗就會收集能量">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="var(--qE)"/></svg>
      <span id="hud-j">0 J</span>
    </div>
    <button class="icon-btn" id="hud-sound" type="button" aria-label="音效開關"></button>
  </div>
</header>
<main id="main" class="main"></main>
<div class="toast-host" id="toast-host" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
/* ---- 00-core.js ---- */
'use strict';
/* ============ tiny helpers ============ */
const $ = (s, r = document) => r.querySelector(s);

/* number formatting — textbook style: 62 400, 7.2 × 10⁶, true minus sign */
const SUPMAP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const sup = n => String(n).split('').map(ch => SUPMAP[ch] || ch).join('');
function nf(x, dp) {
  if (!isFinite(x)) return '—';
  if (dp === undefined) dp = Number.isInteger(round(x, 6)) ? 0 : (Math.abs(x) < 10 ? 2 : 1);
  let s = Math.abs(x).toFixed(dp);
  if (dp > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  let [i, f] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const neg = x < 0 && Number(s) !== 0;
  return (neg ? '−' : '') + i + (f ? '.' + f : '');
}
function sci(x, sf = 2) {
  if (x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x)));
  let m = round(x / 10 ** e, sf - 1);
  if (Math.abs(m) >= 10) { m = round(m / 10, sf - 1); e += 1; }
  return `${nf(m)} × 10${sup(e)}`;
}
/* show big numbers both ways when useful */
const bigNum = x => Math.abs(x) >= 1e6 ? `${sci(x, 3).replace(/\.?0+ ×/, ' ×')}` : nf(x);

/* parse what a student types: "7.2e6", "7.2x10^6", "7.2 × 10⁶", "62 400", "-23", "437.5W" */
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().toLowerCase().replace(/[−–—]/g, '-').replace(/[\s, ]/g, '');
  const supd = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  t = t.replace(/(×|x|\*)10([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (m, op, ex) => 'e' + ex.split('').map(c => supd[c]).join(''));
  t = t.replace(/(×|x|\*)10\^?\(?([-+]?\d+)\)?/g, 'e$2');
  t = t.replace(/[^0-9e.+\-]/g, '');
  if (!t || (t.match(/e/g) || []).length > 1) return NaN;
  if (/^e/.test(t)) return NaN;
  const n = Number(t);
  return isFinite(n) ? n : NaN;
}
function approx(x, ans, rel = 0.01, abs = 0) {
  if (!isFinite(x)) return false;
  return Math.abs(x - ans) <= Math.max(abs, Math.abs(ans) * rel) + 1e-9;
}

/* ============ sound (WebAudio, generated) ============ */
const SFX = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.07, when = 0, slideTo) {
    if (!Store.data.sound) return;
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  return {
    click() { tone(720, 0.05, 'square', 0.025); },
    tick() { tone(1200, 0.03, 'square', 0.02); },
    good() { tone(784, 0.09, 'triangle', 0.08); tone(1175, 0.16, 'triangle', 0.08, 0.08); },
    bad() { tone(220, 0.22, 'sawtooth', 0.045, 0, 140); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, i * 0.09)); },
    sizzle() { tone(320, 0.35, 'sawtooth', 0.02, 0, 900); },
    whoosh() { tone(200, 0.3, 'sine', 0.05, 0, 600); },
    toggle() { Store.data.sound = !Store.data.sound; Store.save(); renderSoundBtn(); if (Store.data.sound) this.good(); }
  };
})();

function toast(msg, kind = '') {

const Confetti = (() => {
  let parts = [], raf = 0;
  const colors = ['#ff5363', '#ffb02e', '#fff2bf', '#38d1ff', '#b892ff', '#52e3a0', '#ff7cc8'];
  function burst(n = 120) {
    if (reduceMotion) return;
    const cv = $('#confetti'); if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = 0; i < n; i++) {
      parts.push({ x: innerWidth / 2 + rand(-80, 80), y: innerHeight * 0.55, vx: rand(-7, 7), vy: rand(-15, -6), r: rand(3, 7), c: pick(colors), a: rand(0, 6.28), va: rand(-.2, .2), life: rand(70, 120) });
    }
    if (!raf) {
      const step = () => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        parts = parts.filter(p => p.life > 0);
        for (const p of parts) {
          p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life--;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.min(1, p.life / 30);
          ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
        }
        if (parts.length) raf = requestAnimationFrame(step); else { raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
      };
      raf = requestAnimationFrame(step);
    }
  }
  return { burst };
})();

const Router = { routes: {}, cleanups: [], pending: false };
function onCleanup(fn) { Router.cleanups.push(fn); }
function go(id) {
  const h = '#' + id;
  if (location.hash === h) { route(); return; }
  Router.pending = true;
  try { location.hash = h; } catch (e) { /* hash blocked */ }
  setTimeout(() => { if (Router.pending) route(id); }, 80);
}
function route(forced) {
  Router.pending = false;
  Router.cleanups.splice(0).forEach(fn => { try { fn(); } catch (e) { /* ignore */ } });
  let id = forced || (location.hash || '#home').slice(1);
  if (!Router.routes[id]) id = 'home';
  Router.current = id;
  const main = $('#main');
  main.innerHTML = '';
  const inner = html('<div class="wrap stack"></div>');
  main.appendChild(inner);
  Router.routes[id](inner);
  window.scrollTo(0, 0);
  updateHUD();
}
/* animation loop that stops itself when the page changes */
function loop(fn) {
  let raf = 0, last = performance.now(), alive = true;
  const step = now => { if (!alive) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (fn(dt, now) === false) { alive = false; return; } raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  const stop = () => { alive = false; cancelAnimationFrame(raf); };
  onCleanup(stop);
  return stop;
}
/* tween numeric SVG attributes, e.g. tweenAttr(rect, {y: 40, height: 260}, 1200) */
function tweenAttr(el, to, ms = 800, done) {
  const from = {};
  for (const k in to) from[k] = parseFloat(el.getAttribute(k)) || 0;
  if (el._tw) el._tw();
  if (reduceMotion || ms <= 0) { for (const k in to) el.setAttribute(k, to[k]); done && done(); return; }
  const t0 = performance.now();
  const stop = loop((dt, now) => {
    const p = clamp((now - t0) / ms, 0, 1), e = p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
    for (const k in to) el.setAttribute(k, lerp(from[k], to[k], e));
    if (p >= 1) { el._tw = null; done && done(); return false; }
  });
  el._tw = stop;
}
function every(ms, fn) { const id = setInterval(fn, ms); onCleanup(() => clearInterval(id)); return () => clearInterval(id); }
function later(ms, fn) { const id = setTimeout(fn, ms); onCleanup(() => clearTimeout(id)); return id; }

/* colour along the thermal (ironbow) ramp, t in 0..1 */
const IRONBOW = [[0, [24, 10, 60]], [0.18, [70, 22, 140]], [0.38, [181, 25, 122]], [0.58, [240, 71, 58]], [0.78, [255, 157, 31]], [1, [255, 246, 190]]];
function ironbow(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < IRONBOW.length; i++) {
    const [t1, c1] = IRONBOW[i]; const [t0, c0] = IRONBOW[i - 1];
    if (t <= t1) { const k = (t - t0) / (t1 - t0); return c0.map((v, j) => Math.round(lerp(v, c1[j], k))); }
  }
  return IRONBOW[IRONBOW.length - 1][1];
}
/* blue → white → red ramp for liquids/objects by temperature (°C) */
function tempColor(T, lo = 0, hi = 100) {
  const t = clamp((T - lo) / (hi - lo), 0, 1);
  const stops = [[0, [79, 140, 255]], [0.45, [150, 200, 255]], [0.6, [255, 196, 120]], [1, [255, 70, 80]]];
  for (let i = 1; i < stops.length; i++) {
    const [t1, c1] = stops[i]; const [t0, c0] = stops[i - 1];
    if (t <= t1) { const k = (t - t0) / (t1 - t0); const c = c0.map((v, j) => Math.round(lerp(v, c1[j], k))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
  }
  return 'rgb(255,70,80)';
}

let currentToc = null;
function station({ world, id, tag, title, goal, short }) {
  const key = `${world}.${id}`;
  const el = html(`<section class="station" id="st-${world}-${id}" data-key="${key}" data-short="${short || title}">
    <header class="st-head"><span class="st-tag">${tag}</span><h2>${title}</h2><span class="st-done"${isDone(key) ? '' : ' hidden'}>✓ 完成</span></header>
    ${goal ? `<div class="st-goal">${goal}</div>` : ''}
  </section>`);
  if (isDone(key)) el.classList.add('is-done');
  const api = {
    el, key,
    add(x) { if (typeof x === 'string') { const f = nodes(x); const first = f.firstElementChild; el.appendChild(f); return first; } el.appendChild(x); return x; },
    complete(j = 500) {
      const fresh = markDone(key, j);
      if (fresh) SFX.win();
      el.classList.add('is-done');
      const d = $('.st-done', el); if (d) d.hidden = false;
      refreshToc();
      return fresh;
    },
    get done() { return isDone(key); }
  };

/* ============ fill in the blanks with word chips ============ */
function fillIn({ text, bank, onDone }) {
  const answers = [];
  const t = text.replace(/\{\{(.+?)\}\}/g, (m, a) => {
    answers.push(a.split('|').map(s => s.trim().toLowerCase()));
    return `<button type="button" class="blank" data-i="${answers.length - 1}" aria-label="空格 ${answers.length}">?</button>`;
  });
  const el = html(`<div class="stack-sm">
    <div class="fill-text">${t}</div>
    <div class="bank" aria-label="詞語"></div>
    <div class="row"><button type="button" class="btn sm cold" data-act="check">檢查答案</button><button type="button" class="btn sm ghost" data-act="clear">清除</button><span class="small fb" aria-live="polite"></span></div>
  </div>`);
  const blanks = $$('.blank', el);
  const vals = blanks.map(() => null);
  let active = 0, solved = false;
  const setActive = i => { active = i; blanks.forEach((b, j) => b.classList.toggle('active', j === i && !solved)); };
  const render = () => blanks.forEach((b, j) => { b.textContent = vals[j] ?? '?'; });
  const bankEl = $('.bank', el);
  shuffle(bank).forEach(word => {
    const c = html(`<button type="button" class="chip">${word}</button>`);
    c.onclick = () => {
      if (solved) return;
      SFX.click();
      if (active < 0) active = vals.findIndex(v => v == null);
      if (active < 0) return;
      vals[active] = word; blanks[active].classList.remove('ok', 'no');
      render();
      const nextEmpty = vals.findIndex(v => v == null);
      setActive(nextEmpty);
    };
    bankEl.appendChild(c);
  });
  blanks.forEach((b, j) => b.onclick = () => { if (solved) return; SFX.tick(); vals[j] = null; b.classList.remove('ok', 'no'); render(); setActive(j); });
  const fb = $('.fb', el);
  $('[data-act="check"]', el).onclick = () => {
    if (solved) return;
    if (vals.some(v => v == null)) { fb.textContent = '仲有空格未填呀！'; fb.className = 'small fb bad'; SFX.bad(); return; }
    let wrong = 0;
    blanks.forEach((b, j) => {
      const ok = answers[j].includes(String(vals[j]).toLowerCase());
      b.classList.toggle('ok', ok); b.classList.toggle('no', !ok);
      if (!ok) { wrong++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
    });
    if (wrong) { fb.textContent = `有 ${wrong} 格唔啱，撳紅色格清除再試。`; fb.className = 'small fb bad'; SFX.bad(); }
    else { solved = true; setActive(-1); fb.textContent = '全部正確！'; fb.className = 'small fb good'; SFX.good(); onDone && onDone(); }
  };
  $('[data-act="clear"]', el).onclick = () => { if (solved) return; vals.fill(null); blanks.forEach(b => b.classList.remove('ok', 'no')); render(); setActive(0); fb.textContent = ''; };
  render(); setActive(0);
  return el;
}

function numAnswer({ id, label, unit, answer, rel = 0.01, abs = 0, traps = [], hint, reveal, onOk, placeholder = '輸入答案' }) {
  const el = html(`<div class="stack-sm">

  const inp = $('input', el), btn = $('button', el), fbw = $('.fbw', el);
  let tries = 0, solved = false;
  const check = () => {
    if (solved) return;
    const x = parseNum(inp.value);
    if (!isFinite(x)) { fbw.innerHTML = '<span class="bad">請輸入數字（例如 62400 或 7.2e6）。</span>'; SFX.bad(); return; }
    if (approx(x, answer, rel, abs)) {

      fbw.innerHTML = `<span class="good">正確！</span>${reveal ? `<div class="work" style="margin-top:8px">${reveal}</div>` : ''}`;
      onOk && onOk(x);
      return;
    }
    tries++;
    inp.classList.add('no'); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); SFX.bad();
    const trap = traps.find(t => t.test(x));
    let msg = trap ? `<span class="bad">陷阱！</span>${trap.msg}` : '<span class="bad">唔啱，再試一次。</span>';
    if (!trap && hint && tries >= 1) msg += ` <span class="muted">提示：${hint}</span>`;
    if (tries >= 3 && reveal) msg += `<div class="row" style="margin-top:6px"><button type="button" class="btn sm ghost" data-reveal>睇埋答案</button></div>`;
    fbw.innerHTML = msg;

}

/* ============ solver coach: knowns → formula → answer ============ */
/* problem = { title, q, zh, steps:[{kind:'knowns', items:[{sym,val,unit,traps:[{v,msg}],hint}]}, {kind:'formula', options, answer}, {kind:'calc', sym, val, unit, rel, abs, traps}], work:[lines] } */
function coach(problem, onDone) {
  const el = html(`<div class="stack-sm">
    <div class="panel-soft stack-sm"><div class="q-text">${problem.q}</div>${problem.zh ? `<div class="q-zh">${problem.zh}</div>` : ''}</div>
    <div class="steps stack-sm"></div></div>`);
  const stepsEl = $('.steps', el);
  let idx = 0;
  const finish = () => {
    stepsEl.appendChild(html(`<div class="feedback ok pop"><div class="fb-title">搞掂！完整寫法：</div><div class="work">${problem.work.map(l => `<div class="ln">${l}</div>`).join('')}</div></div>`));
    onDone && onDone();
  };
  const next = () => {
    if (idx >= problem.steps.length) { finish(); return; }
    const s = problem.steps[idx++];
    const box = html(`<div class="panel-inset stack-sm pop"><div class="lbl">${s.label || ''}</div></div>`);
    stepsEl.appendChild(box);
    if (s.kind === 'knowns') {
      const grid = html('<div class="stack-sm"></div>'); box.appendChild(grid);
      const rows = s.items.map((it, k) => {
        const r = html(`<div class="row"><span class="fx" style="min-width:3.2em">${it.sym} =</span><span class="input-unit"><input class="num sm" inputmode="decimal" autocomplete="off" id="${problem.id}-k${idx}-${k}" aria-label="${it.name || 'value'}"><span class="u">${it.unit}</span></span><span class="small msg"></span></div>`);
        grid.appendChild(r); return r;
      });
      const b = html('<div class="row"><button type="button" class="btn sm cold">檢查已知數</button></div>'); box.appendChild(b);
      $('button', b).onclick = () => {
        let allOk = true;
        rows.forEach((r, k) => {
          const it = s.items[k]; const inp = $('input', r); const msg = $('.msg', r);
          if (inp.readOnly) return;
          const x = parseNum(inp.value);
          if (approx(x, it.val, it.rel ?? 0.001, it.abs ?? 0)) { inp.classList.add('ok'); inp.classList.remove('no'); inp.readOnly = true; msg.innerHTML = '<span class="good">✓</span>'; return; }
          allOk = false; inp.classList.add('no');
          const trap = (it.traps || []).find(t => isFinite(x) && approx(x, t.v, 0.001));
          msg.innerHTML = !isFinite(x) ? '<span class="bad">要填數字</span>' : trap ? `<span class="bad">${trap.msg}</span>` : `<span class="bad">唔啱。</span>${it.hint ? `<span class="muted"> ${it.hint}</span>` : ''}`;
        });
        if (allOk) { SFX.good(); $('button', b).disabled = true; next(); } else SFX.bad();
      };
    } else if (s.kind === 'formula') {
      box.appendChild(mcq({ options: s.options, answer: s.answer, onDone: () => later(350, next), cols2: true }));
    } else if (s.kind === 'calc') {
      box.appendChild(numAnswer({ id: `${problem.id}-calc${idx}`, label: s.prompt || '', unit: s.unit, answer: s.val, rel: s.rel ?? 0.005, abs: s.abs ?? 0,
        traps: (s.traps || []).map(t => ({ test: x => approx(x, t.v, 0.003), msg: t.msg })), hint: s.hint, onOk: () => later(300, next) }));
    }
  };
  next();
  return el;
}

/* ---- 05-calc.js ---- */
/* ============ pocket calculator: a floating button on every page summons it from the side ============ */
const Calc = (() => {
  const KEY = 'heatlab.calc';
  let st = { open: false, ans: 0, hist: [] };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { /* storage blocked */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* storage blocked */ } };

  let toks = [];        // expression as tokens: digits, '.', 'E', '+', '-', '*', '/', '(', ')', '√', '²', 'Ans'
  let result = null;    // last evaluated value (null = nothing yet)
  let justEval = false; // after '=', typing a digit starts a new sum
  let lastInput = null; // last answer box the student clicked on the page

  /* ---- parser (no eval) ---- */
  function evaluate(t) {
    let i = 0;
    const peek = () => t[i];
    const isDigit = k => k !== undefined && /^[0-9.]$/.test(k);
    const fail = () => { throw new Error('syntax'); };
    function number() {
      let s = '';
      while (isDigit(peek())) s += t[i++];
      if (peek() === 'E') {
        i++; s += 'e';
        if (peek() === '-' || peek() === '+') s += t[i++];
        if (!/^[0-9]$/.test(peek() || '')) fail();
        while (/^[0-9]$/.test(peek() || '')) s += t[i++];
      }
      if ((s.match(/\./g) || []).length > 1 || s === '.') fail();
      return Number(s);
    }
    function primary() {
      const k = peek();
      if (isDigit(k)) return number();
      if (k === 'Ans') { i++; return st.ans; }
      if (k === '(') { i++; const v = expr(); if (peek() === ')') i++; else if (i < t.length) fail(); return v; }
      fail();
    }
    function postfix() { let v = primary(); while (peek() === '²') { i++; v = v * v; } return v; }
    function unary() {
      if (peek() === '-') { i++; return -unary(); }
      if (peek() === '+') { i++; return unary(); }
      if (peek() === '√') { i++; const v = unary(); if (v < 0) throw new Error('math'); return Math.sqrt(v); }
      return postfix();
    }
    function term() {
      let v = unary();
      for (;;) {
        const k = peek();
        if (k === '*') { i++; v *= unary(); }
        else if (k === '/') { i++; const d = unary(); if (d === 0) throw new Error('math'); v /= d; }
        else if (k === '(' || k === '√' || k === 'Ans' || (isDigit(k) && t[i - 1] === ')')) v *= unary(); // 2(3), 2√9
        else return v;
      }
    }
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') { const op = t[i++]; const w = term(); v = op === '+' ? v + w : v - w; }
      return v;
    }
    if (!t.length) fail();
    const v = expr();
    if (i < t.length) fail();
    if (!isFinite(v)) throw new Error('math');
    return Number(v.toPrecision(12));
  }

  /* ---- display ---- */
  const SHOW = { '*': '×', '/': '÷', '-': '−', '+': '+', 'Ans': 'Ans' };
  function exprHTML(t) {
    let out = '', inExp = false;
    t.forEach((k, j) => {
      if (k === 'E') { out += '×10<sup>'; inExp = true; return; }
      if (inExp && !(/^[0-9]$/.test(k) || (k === '-' && t[j - 1] === 'E'))) { out += '</sup>'; inExp = false; }
      out += k === '-' && inExp ? '−' : (SHOW[k] || k);
    });
    if (inExp) out += '</sup>';
    return out || '<span class="dim">0</span>';
  }
  function resultHTML(x) {
    const a = Math.abs(x);
    if (a !== 0 && (a >= 1e7 || a < 1e-3)) {
      let e = Math.floor(Math.log10(a)), m = Number((x / 10 ** e).toPrecision(6));
      if (Math.abs(m) >= 10) { m /= 10; e += 1; }
      return `${nf(m, 5)} × 10<sup>${e}</sup>`;
    }
    return nf(x, 6);
  }
  /* plain text the page's answer boxes understand (parseNum) */
  const plain = x => String(x).replace('e+', 'e');
  const toTokens = x => plain(x).replace('e', 'E').split('');

  /* ---- DOM ---- */
  const fab = html(`<button type="button" class="calc-fab" id="calc-fab" aria-label="計數機" aria-expanded="false" title="計數機">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="2.5" width="15" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7.5" y="5.5" width="9" height="4" rx="1" fill="currentColor"/><g fill="currentColor"><circle cx="8.6" cy="13.2" r="1.2"/><circle cx="12" cy="13.2" r="1.2"/><circle cx="15.4" cy="13.2" r="1.2"/><circle cx="8.6" cy="17.4" r="1.2"/><circle cx="12" cy="17.4" r="1.2"/><circle cx="15.4" cy="17.4" r="1.2"/></g></svg>
    <span class="calc-fab-lbl">計數機</span></button>`);
  const KEYS = [
    ['AC', 'ac', 'fn'], ['DEL', 'del', 'fn'], ['(', '(', ''], [')', ')', ''], ['÷', '/', 'op'],
    ['7', '7', 'n'], ['8', '8', 'n'], ['9', '9', 'n'], ['x²', '²', ''], ['×', '*', 'op'],
    ['4', '4', 'n'], ['5', '5', 'n'], ['6', '6', 'n'], ['√', '√', ''], ['−', '-', 'op'],
    ['1', '1', 'n'], ['2', '2', 'n'], ['3', '3', 'n'], ['×10<sup>x</sup>', 'E', ''], ['+', '+', 'op'],
    ['0', '0', 'n'], ['.', '.', 'n'], ['Ans', 'Ans', ''], ['=', 'eq', 'eq']
  ];
  const panel = html(`<section class="calc" id="calc" role="dialog" aria-label="計數機" hidden>
    <div class="calc-head">
      <span class="calc-title">計數機</span>
      <button type="button" class="calc-x" data-close aria-label="收起計數機">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="calc-screen">
      <div class="calc-expr mono" aria-live="off"></div>
      <div class="calc-res mono" aria-live="polite"></div>
    </div>
    <div class="calc-hist"></div>
    <div class="calc-keys">${KEYS.map(([lbl, k, cls]) => `<button type="button" class="ck ${cls}" data-k="${k}">${lbl}</button>`).join('')}</div>
    <button type="button" class="btn sm cold calc-fill" data-fill hidden>填入答案格</button>
  </section>`);
  document.body.append(panel, fab);
  const exprEl = $('.calc-expr', panel), resEl = $('.calc-res', panel), histEl = $('.calc-hist', panel), fillBtn = $('[data-fill]', panel);

  function render() {
    exprEl.innerHTML = exprHTML(toks);
    exprEl.scrollLeft = exprEl.scrollWidth;
    if (typeof result === 'string') resEl.innerHTML = `<span class="bad">${result}</span>`;
    else resEl.innerHTML = result === null ? '' : '= ' + resultHTML(result);
    histEl.innerHTML = st.hist.map((x, j) => `<button type="button" class="calc-chip mono" data-h="${j}" title="放入算式">${resultHTML(x)}</button>`).join('');
    const canFill = typeof result === 'number' && lastInput && lastInput.isConnected && !lastInput.readOnly;
    fillBtn.hidden = !canFill;
  }

  function press(k) {
    if (k === 'ac') { toks = []; result = null; justEval = false; }
    else if (k === 'del') { if (justEval) { result = null; justEval = false; } toks.pop(); }
    else if (k === 'eq') {
      if (!toks.length) return;
      try {
        const v = evaluate(toks);
        result = v; st.ans = v; justEval = true;
        if (st.hist[0] !== v) st.hist = [v].concat(st.hist).slice(0, 4);
        save(); SFX.click();
      } catch (e) { result = e.message === 'math' ? '計唔到（Math error）' : '算式唔完整（Syntax error）'; justEval = false; }
    } else {
      if (justEval) {
        // continue from the answer with an operator; start fresh with a number
        toks = /^[+\-*/²]$/.test(k) ? ['Ans'] : [];
        result = null; justEval = false;
      }
      toks.push(k);
    }
    render();
  }

  function setOpen(on) {
    st.open = on; save();
    panel.hidden = !on;
    fab.setAttribute('aria-expanded', String(on));
    fab.classList.toggle('on', on);
    if (on) { panel.classList.remove('in'); void panel.offsetWidth; panel.classList.add('in'); render(); }
  }

  fab.addEventListener('click', () => { SFX.click(); setOpen(panel.hidden); });
  panel.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) press(b.dataset.k);
    else if (b.hasAttribute('data-close')) setOpen(false);
    else if (b.dataset.h !== undefined) {
      const x = st.hist[+b.dataset.h];
      if (justEval) { toks = []; result = null; justEval = false; }
      toks.push(...toTokens(x)); render();
    } else if (b.hasAttribute('data-fill') && typeof result === 'number' && lastInput) {
      lastInput.value = plain(result);
      lastInput.dispatchEvent(new Event('input', { bubbles: true }));
      lastInput.focus();
      toast('已填入，記得撳「檢查」', 'good');
    }
  });

  /* remember which answer box to fill */
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (el.matches && el.matches('#main input.num, #main input[inputmode="decimal"]')) { lastInput = el; if (!panel.hidden) render(); }
  });

  /* keyboard: works while the calculator is open and you are not typing in a box on the page */
  const KB = { '*': '*', 'x': '*', 'X': '*', '/': '/', '+': '+', '-': '-', '(': '(', ')': ')', '.': '.', 'e': 'E', 'E': 'E', '^': '²', 'Enter': 'eq', '=': 'eq', 'Backspace': 'del', 'Delete': 'ac' };
  document.addEventListener('keydown', e => {
    if (panel.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { setOpen(false); fab.focus(); return; }
    const tgt = e.target;
    if (tgt.closest && (tgt.closest('input, textarea, select, [contenteditable]') || (tgt.closest('button') && !panel.contains(tgt) && (e.key === 'Enter' || e.key === ' ')))) return;
    const k = /^[0-9]$/.test(e.key) ? e.key : KB[e.key];
    if (!k) return;
    e.preventDefault();
    press(k);
  });

  if (st.open) setOpen(true);
  return { open: () => setOpen(true), close: () => setOpen(false) };
})();

/* ============ the thermal-camera hero: drag to add heat, watch it spread ============ */
function thermalHero(host) {
  const cv = html('<canvas aria-hidden="true"></canvas>');
  host.prepend(cv);
  const W = 120, H = 54;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  let T = new Float32Array(W * H), T2 = new Float32Array(W * H);
  const amb = 0.06;
  T.fill(amb);
  const lut = []; for (let i = 0; i < 256; i++) lut.push(ironbow(i / 255));
  /* stamp the character 熱 as a heat signature on the right */
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d');
  o.fillStyle = '#fff'; o.font = `bold ${Math.round(H * 0.82)}px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillText('熱', W * 0.78, H * 0.54);
  const a = o.getImageData(0, 0, W, H).data;
  const stamp = v => { for (let i = 0; i < W * H; i++) if (a[i * 4 + 3] > 80) T[i] = Math.max(T[i], v); };
  stamp(1.15);
  const heat = (gx, gy, amt, rad = 3.2) => {
    const r = Math.ceil(rad);
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const X = Math.round(gx + x), Y = Math.round(gy + y);
      if (X < 1 || Y < 1 || X >= W - 1 || Y >= H - 1) continue;
      const d = Math.hypot(x, y) / rad; if (d > 1) continue;
      const k = Y * W + X; T[k] = Math.min(1.25, T[k] + amt * (1 - d * d));
    }
  };
  const step = () => {
    const kd = 0.16, cool = 0.003;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      T2[i] = T[i] + kd * (T[i - 1] + T[i + 1] + T[i - W] + T[i + W] - 4 * T[i]) - cool * (T[i] - amb);
    }
    for (let x = 0; x < W; x++) { T2[x] = T2[x + W]; T2[(H - 1) * W + x] = T2[(H - 2) * W + x]; }
    for (let y = 0; y < H; y++) { T2[y * W] = T2[y * W + 1]; T2[y * W + W - 1] = T2[y * W + W - 2]; }
    [T, T2] = [T2, T];
  };
  const paint = () => {
    const d = img.data;
    for (let i = 0; i < W * H; i++) {
      const c = lut[Math.max(0, Math.min(255, Math.round(T[i] / 1.15 * 255)))];
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  };
  let lastPointer = 0;
  const onMove = e => {
    const r = cv.getBoundingClientRect();
    const gx = (e.clientX - r.left) / r.width * W, gy = (e.clientY - r.top) / r.height * H;
    heat(gx, gy, 0.45);
    lastPointer = performance.now();
  };
  host.addEventListener('pointermove', onMove);
  host.addEventListener('pointerdown', onMove);
  if (reduceMotion) { for (let i = 0; i < 40; i++) step(); paint(); return; }
  for (let i = 0; i < 6; i++) step();
  paint();
  let tt = 0, sinceStamp = 0;
  loop((dt, now) => {
    tt += dt; sinceStamp += dt;
    if (sinceStamp > 11 && now - lastPointer > 4000) { stamp(1.1); sinceStamp = 0; }
    if (now - lastPointer > 2500) {
      /* idle: a little warm "cup" wanders so the picture never freezes */
      heat(W * (0.35 + 0.25 * Math.sin(tt * 0.5)), H * (0.55 + 0.3 * Math.sin(tt * 0.83)), 0.12, 3.5);
    }
    step();
    paint();
  });
}

function tfCards(list, onDone) {
  const el = html('<div class="stack-sm"><div class="row-between"><span class="score-pill tf-n"></span></div><div class="tf-slot"></div></div>');
  let i = 0, right = 0;
  const slot = $('.tf-slot', el), n = $('.tf-n', el);
  const show = () => {
    n.textContent = `第 ${i + 1} / ${list.length} 句`;
    const it = list[i];
    const card = html(`<div class="panel-soft stack-sm pop">
      <div class="q-text">${it.en}</div>${it.zh ? `<div class="q-zh">${it.zh}</div>` : ''}
      <div class="row"><button type="button" class="btn cold" data-v="1">✓ 啱 True</button><button type="button" class="btn hot" data-v="0">✗ 錯 False</button></div>
      <div class="fbw"></div></div>`);
    $$('[data-v]', card).forEach(b => b.onclick = () => {
      const ok = (b.dataset.v === '1') === it.ans;
      $$('[data-v]', card).forEach(x => x.disabled = true);
      if (ok) { right++; SFX.good(); } else SFX.bad();
      $('.fbw', card).replaceChildren(html(`<div class="feedback ${ok ? 'ok' : 'no'}"><div class="fb-title">${ok ? '答啱！' : '唔啱'}（答案：${it.ans ? 'True' : 'False'}）</div>${it.why || ''}</div>`));
      const nb = html(`<div class="row"><button type="button" class="btn sm">${i < list.length - 1 ? '下一句 →' : '完成'}</button></div>`);
      $('button', nb).onclick = () => { SFX.click(); i++; if (i < list.length) show(); else { slot.replaceChildren(html(`<div class="feedback ok pop"><div class="fb-title">完成！答啱 ${right} / ${list.length}</div>${right < list.length ? '答錯嘅可以再撳「再玩」重溫。' : '全部正確，好嘢！'}<div class="row" style="margin-top:8px"><button type="button" class="btn sm ghost" data-again>再玩</button></div></div>`)); $('[data-again]', slot).onclick = () => { i = 0; right = 0; show(); }; onDone && onDone(right, list.length); } };
      card.appendChild(nb);
    });
    slot.replaceChildren(card);
  };
  show();
  return el;
}

/* interactive axes inside an existing <svg>; returns scale functions */
function axes(svg, s) {
  const [L, T, W, H] = s.box;               // plot area in viewBox units
  const sx = x => L + (x - s.x[0]) / (s.x[1] - s.x[0]) * W;
  const sy = y => T + H - (y - s.y[0]) / (s.y[1] - s.y[0]) * H;
  const g = svgEl('g', {}, svg);
  if (s.grid) {
    for (const x of s.xt) svgEl('path', { d: `M${sx(x)} ${T} V${T + H}`, style: 'stroke:var(--line)', 'stroke-width': 1 }, g);
    for (const y of s.yt) svgEl('path', { d: `M${L} ${sy(y)} H${L + W}`, style: 'stroke:var(--line)', 'stroke-width': 1 }, g);
  }
  const ax0 = s.y[0] <= 0 && s.y[1] >= 0 ? sy(0) : T + H;
  const ay0 = s.x[0] <= 0 && s.x[1] >= 0 ? sx(0) : L;
  svgEl('path', { d: `M${ay0} ${T - 8} V${T + H} M${L} ${ax0} H${L + W + 10}`, fill: 'none', style: 'stroke:var(--muted)', 'stroke-width': 1.6 }, g);
  for (const x of s.xt) { svgEl('path', { d: `M${sx(x)} ${ax0} v5`, style: 'stroke:var(--muted)' }, g); const t = svgEl('text', { x: sx(x), y: ax0 + 18, 'text-anchor': 'middle', 'font-size': 12, style: 'fill:var(--muted)' }, g); t.textContent = s.xf ? s.xf(x) : x; }
  for (const y of s.yt) { svgEl('path', { d: `M${ay0} ${sy(y)} h-5`, style: 'stroke:var(--muted)' }, g); const t = svgEl('text', { x: ay0 - 8, y: sy(y) + 4, 'text-anchor': 'end', 'font-size': 12, style: 'fill:var(--muted)' }, g); t.textContent = s.yf ? s.yf(y) : y; }
  const xl = svgEl('text', { x: L + W + 10, y: ax0 + 34, 'text-anchor': 'end', 'font-size': 12, style: 'fill:var(--muted)' }, g); xl.textContent = s.xl || '';
  const yl = svgEl('text', { x: ay0 - 6, y: T - 14, 'text-anchor': 'start', 'font-size': 12, style: 'fill:var(--muted)' }, g); yl.textContent = s.yl || '';
  return { sx, sy, g };
}

/* one-try multiple-choice run: items = [{q, opts, ans, why}] — passes when right >= need */
function quickRun(items, need, onPass, label = '題') {
  const el = html('<div class="panel-inset stack-sm"></div>');
  const run = () => {
    const list = shuffle(items).slice(0, Math.min(items.length, 6));
    let i = 0, right = 0;
    const one = () => {
      if (i >= list.length) {
        const ok = right >= need;
        el.replaceChildren(html(`<div class="stack-sm center"><div class="result-big ${ok ? 'good' : 'bad'}">${right} / ${list.length}</div><div>${ok ? '過關！' : `要 ${need} ${label}或以上，再嚟！`}</div><div class="row" style="justify-content:center"><button type="button" class="btn sm" data-r>再玩</button></div></div>`));
        $('[data-r]', el).onclick = () => { SFX.click(); run(); };
        if (ok) { onPass && onPass(); }
        return;
      }
      const it = list[i];
      const order = shuffle(it.opts.map((_, k) => k));
      const card = html(`<div class="stack-sm"><div class="row-between"><span class="score-pill">第 ${i + 1} / ${list.length} ${label}</span><span class="score-pill">答啱 ${right}</span></div>
        <div class="q-text">${it.q}</div><div class="opts ${it.opts.every(o => o.length < 22) ? 'cols2' : ''}"></div><div class="fbw" style="min-height:1.6em"></div></div>`);
      order.forEach((k, pos) => {
        const b = html(`<button type="button" class="opt"><span class="k">${'ABCD'[pos]}</span><span class="t">${it.opts[k]}</span></button>`);
        b.onclick = () => {
          const all = $$('.opt', card); all.forEach(x => x.disabled = true);
          const ok = k === it.ans; if (ok) { right++; SFX.good(); } else SFX.bad();
          b.classList.add(ok ? 'ok' : 'no'); all[order.indexOf(it.ans)].classList.add('ok');
          $('.fbw', card).innerHTML = `<span class="small ${ok ? 'good' : 'bad'}">${ok ? '啱！' : '唔啱。'}</span> <span class="small muted">${it.why || ''}</span>`;
          const nb = html(`<div class="row"><button type="button" class="btn sm hot">${i < list.length - 1 ? '下一題 →' : '睇結果'}</button></div>`);
          $('button', nb).onclick = () => { SFX.click(); i++; one(); };
          card.appendChild(nb);
        };
        $('.opts', card).appendChild(b);
      });
      el.replaceChildren(card);
    };
    one();
  };
  run();
  return el;
}

        const c = html(`<button type="button" class="chip">${p.n}</button>`);

          const q = p.rnd ? { mh: round(rand(0.1, 2), 1), Th: randInt(50, 100), mc: round(rand(0.1, 2), 1), Tc: randInt(0, 30), k: pick(['none', 'none', 'iron']) } : p;

      $('[data-reset]', box).onclick = () => { if (busy) return; SFX.click(); paint(); $('.mx-out', box).replaceChildren(); };

/* small line graph for questions: spec = {x:[0,20], y:[0,100], xt:[...], yt:[...], xl, yl, lines:[{p:[[x,y],[x,y]], label, at:[x,y]}], guides:[[[x,y],[x,y]]]} */
function lineGraph(s) {
  const W = 380, H = 250, L = 52, R = 70, T = 26, B = 40;
  const sx = x => L + (x - s.x[0]) / (s.x[1] - s.x[0]) * (W - L - R);
  const sy = y => H - B - (y - s.y[0]) / (s.y[1] - s.y[0]) * (H - T - B);
  const tk = t => Array.isArray(t) ? t : [t, String(t)];
  let g = `<svg class="svg-fit" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.yl} 對 ${s.xl} 的線圖">`;
  g += `<path d="M${L} ${T - 12} V${H - B} H${W - R + 26}" fill="none" style="stroke:var(--muted)" stroke-width="1.8"/>`;
  g += `<path d="M${L - 5} ${T - 4} L${L} ${T - 14} L${L + 5} ${T - 4}" fill="none" style="stroke:var(--muted)" stroke-width="1.8"/>`;
  g += `<path d="M${W - R + 18} ${H - B - 5} L${W - R + 28} ${H - B} L${W - R + 18} ${H - B + 5}" fill="none" style="stroke:var(--muted)" stroke-width="1.8"/>`;
  g += `<text x="${L - 8}" y="${T - 16}" font-size="12" text-anchor="start" style="fill:var(--muted)">${s.yl}</text>`;
  g += `<text x="${W - 8}" y="${H - B + 30}" font-size="12" text-anchor="end" style="fill:var(--muted)">${s.xl}</text>`;
  g += `<text x="${L - 8}" y="${H - B + 16}" font-size="12" text-anchor="end" style="fill:var(--muted)">0</text>`;
  for (const t of (s.xt || [])) { const [v, lab] = tk(t); g += `<path d="M${sx(v)} ${H - B} v5" style="stroke:var(--muted)"/><text x="${sx(v)}" y="${H - B + 18}" font-size="12" text-anchor="middle" style="fill:var(--muted)">${lab}</text>`; }
  for (const t of (s.yt || [])) { const [v, lab] = tk(t); g += `<path d="M${L} ${sy(v)} h-5" style="stroke:var(--muted)"/><text x="${L - 8}" y="${sy(v) + 4}" font-size="12" text-anchor="end" style="fill:var(--muted)">${lab}</text>`; }
  for (const gd of (s.guides || [])) g += `<path d="M${sx(gd[0][0])} ${sy(gd[0][1])} L${sx(gd[1][0])} ${sy(gd[1][1])}" style="stroke:var(--dim)" stroke-dasharray="4 4" stroke-width="1.3"/>`;
  const cols = ['var(--text)', 'var(--cool)', 'var(--warm)', 'var(--qc)'];
  (s.lines || []).forEach((ln, i) => {
    const c = s.mono ? 'var(--text)' : cols[i % cols.length];
    g += `<path d="M${ln.p.map(([x, y]) => `${sx(x)} ${sy(y)}`).join(' L')}" fill="none" style="stroke:${c}" stroke-width="2.6" stroke-linecap="round"/>`;
    if (ln.label) { const [ax, ay] = ln.at || ln.p[ln.p.length - 1]; g += `<text x="${sx(ax) + (ln.dx ?? 6)}" y="${sy(ay) + (ln.dy ?? -6)}" font-size="15" font-weight="700" font-style="italic" style="fill:${c};font-family:var(--font-math)">${ln.label}</text>`; }
  });
  return g + '</svg>';
}
